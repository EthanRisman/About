<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy 1 year, Alison</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../mediaqueries.css" />
    <link rel="stylesheet" href="./song.css" />
  </head>
  <body>
    <!-- Decorative falling clipart. Populated by the script at the bottom. -->
    <div class="falling" aria-hidden="true"></div>

    <section id="song">
      <h1 class="title">Happy 1 year, Alison</h1>

      <div class="song-container">
        <!--
          ============================================================
          EMBED AN MP3 HERE
          ------------------------------------------------------------
          1. Drop the file into  /assets/
          2. Point the <source> below at it.

          To host more than one track, copy the whole
          <div class="track"> ... </div> block.
          ============================================================
        -->
        <div class="track">
          <audio class="track-player" controls preload="metadata">
            <source src="../assets/AlisonSong.mp3" type="audio/mpeg" />
            Your browser does not support the audio element.
            <a href="../assets/AlisonSong.mp3">Download the MP3</a> instead.
          </audio>

          <p class="track-fallback" hidden>
            No audio file found yet &mdash; check back soon.
          </p>
        </div>
      </div>

      <!--
        ============================================================
        PHOTO CAROUSEL
        ------------------------------------------------------------
        Slides are plain <img> tags so they still show without JS.
        To change the photos, drop files in /assets/photos/ and edit
        the list below -- the script picks up whatever is here.
        Order is chronological.
        ============================================================
      -->
      <div
        class="carousel"
        role="region"
        aria-roledescription="carousel"
        aria-label="Photos"
        tabindex="0"
      >
        <div class="carousel-viewport">
          <div class="carousel-track">
            <img class="slide" src="../assets/photos/first.jpg" alt="" draggable="false" decoding="async" />
            <img class="slide" src="../assets/photos/tsa.jpg" alt="" draggable="false" decoding="async" />
            <img class="slide" src="../assets/photos/yankee.jpg" alt="" draggable="false" decoding="async" />
            <img class="slide" src="../assets/photos/freddie.jpg" alt="" draggable="false" decoding="async" />
            <img class="slide" src="../assets/photos/concert.jpg" alt="" draggable="false" decoding="async" />
            <img class="slide" src="../assets/photos/horse.jpg" alt="" draggable="false" decoding="async" />
            <img class="slide" src="../assets/photos/plaza.jpg" alt="" draggable="false" decoding="async" />
            <img class="slide" src="../assets/photos/spainwine.jpg" alt="" draggable="false" decoding="async" />
            <img class="slide" src="../assets/photos/maine.jpg" alt="" draggable="false" decoding="async" />
            <img class="slide" src="../assets/photos/lobsta.jpg" alt="" draggable="false" decoding="async" />
            <img class="slide" src="../assets/photos/fixedit.jpg" alt="" draggable="false" decoding="async" />
            <img class="slide" src="../assets/photos/proposalphoto.jpg" alt="" draggable="false" decoding="async" />
          </div>
        </div>
        <div class="carousel-dots"></div>
      </div>
    </section>

    <script>
      // If the MP3 hasn't been uploaded yet, hide the dead player and say so.
      // Note: with <source> children, a failed load fires "error" on the
      // <source>, not on the <audio> element -- so listen on both.
      document.querySelectorAll(".track").forEach((track) => {
        const player = track.querySelector(".track-player");
        const fallback = track.querySelector(".track-fallback");
        const showFallback = () => {
          player.hidden = true;
          fallback.hidden = false;
        };
        player.addEventListener("error", showFallback);
        track
          .querySelectorAll(".track-player source")
          .forEach((src) => src.addEventListener("error", showFallback));
      });
    </script>

    <script>
      // ---- Falling clipart -------------------------------------------------
      // Add or remove filenames here to change what falls. Files live in
      // /assets/clipart/ and should be PNGs with transparent backgrounds.
      (function () {
        const ART = [
          "flowers.png",
          "roses.png",
          "wine.png",
          "dog1.png",
          "dog2.png",
          "baseball.png",
          "musicnote.png",
          "musicnote2.png",
        ];
        // Items travel from -25vh to 125vh, so only about two thirds are on
        // screen at any moment. Fewer on narrow screens: phones are both
        // tighter on space and slower to animate.
        const COUNT = window.innerWidth < 700 ? 22 : 42;

        const layer = document.querySelector(".falling");
        if (!layer) return;

        const rand = (min, max) => min + Math.random() * (max - min);
        const shuffle = (arr) => {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        };

        // Give each item its own horizontal column and its own slice of the
        // fall cycle, jittered within it. Plain Math.random() for both clumps
        // badly at this few items, leaving bare patches and dense streaks.
        const columns = shuffle(Array.from({ length: COUNT }, (_, i) => i));

        // Repeat the art list to fill COUNT, then shuffle it. Indexing ART by
        // the loop counter instead would march the clipart down the screen in
        // a repeating order, since the counter also sets the fall progress.
        const picks = shuffle(
          Array.from({ length: COUNT }, (_, i) => ART[i % ART.length])
        );

        for (let i = 0; i < COUNT; i++) {
          const fall = document.createElement("span");
          fall.className = "fall";
          const duration = rand(11, 24);
          fall.style.left =
            (((columns[i] + rand(0.15, 0.85)) / COUNT) * 96).toFixed(2) + "vw";
          fall.style.animationDuration = duration.toFixed(2) + "s";
          // Negative delay starts each item mid-flight, so the screen is
          // already full on load instead of filling from the top.
          const progress = (i + rand(0.15, 0.85)) / COUNT;
          fall.style.animationDelay = (-progress * duration).toFixed(2) + "s";

          const sway = document.createElement("span");
          sway.className = "sway";
          const swayDur = rand(3, 7);
          sway.style.animationDuration = swayDur.toFixed(2) + "s";
          sway.style.animationDelay = (-rand(0, 2 * swayDur)).toFixed(2) + "s";

          const img = document.createElement("img");
          img.src = "../assets/clipart/" + picks[i];
          img.alt = "";
          img.style.width = rand(34, 62).toFixed(1) + "px";
          img.style.opacity = rand(0.65, 0.95).toFixed(2);
          const rotDur = rand(9, 20);
          img.style.animationDuration = rotDur.toFixed(2) + "s";
          img.style.animationDelay = (-rand(0, rotDur)).toFixed(2) + "s";
          if (Math.random() < 0.5) img.style.animationDirection = "reverse";

          sway.appendChild(img);
          fall.appendChild(sway);
          layer.appendChild(fall);
        }
      })();
    </script>

    <script>
      // ---- Photo carousel --------------------------------------------------
      // Advances every 4s. Any manual interaction (swipe, drag, arrow key,
      // dot) pauses the rotation for 30s, then it resumes on its own.
      (function () {
        const INTERVAL = 4000;
        const PAUSE = 30000;
        const SWIPE_RATIO = 0.12; // fraction of width that counts as a swipe
        const SWIPE_MIN = 40; // ...but never less than this many px

        const carousel = document.querySelector(".carousel");
        if (!carousel) return;
        const track = carousel.querySelector(".carousel-track");
        const dotsBox = carousel.querySelector(".carousel-dots");
        const slides = Array.from(track.children);
        const count = slides.length;
        if (count < 2) return;

        const calm = window.matchMedia("(prefers-reduced-motion: reduce)");

        let index = 0;
        let timer = null;
        let resumeTimer = null;

        // --- dots ---
        const dots = slides.map((_, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "dot";
          b.setAttribute("aria-label", "Photo " + (i + 1) + " of " + count);
          b.addEventListener("click", () => {
            show(i);
            hold();
          });
          dotsBox.appendChild(b);
          return b;
        });

        function show(i) {
          index = (i + count) % count;
          track.style.transform = "translateX(" + -index * 100 + "%)";
          dots.forEach((d, n) => d.classList.toggle("is-active", n === index));
        }

        // --- timing ---
        function play() {
          if (calm.matches) return; // no auto-advance if motion is unwelcome
          stop();
          timer = setInterval(() => show(index + 1), INTERVAL);
        }
        function stop() {
          clearInterval(timer);
          timer = null;
        }
        // Pause after a manual interaction, then pick the rotation back up.
        function hold() {
          stop();
          clearTimeout(resumeTimer);
          // Clear the handle as it fires: the visibilitychange guard below
          // treats a non-null resumeTimer as "a hold is still pending".
          resumeTimer = setTimeout(() => {
            resumeTimer = null;
            play();
          }, PAUSE);
        }

        // --- swipe / drag (pointer events cover touch, mouse and pen) ---
        let startX = 0;
        let dx = 0;
        let dragging = false;

        carousel.addEventListener("pointerdown", (e) => {
          if (e.button !== 0 && e.pointerType === "mouse") return;
          dragging = true;
          startX = e.clientX;
          dx = 0;
          stop();
          track.classList.add("is-dragging");
          carousel.setPointerCapture(e.pointerId);
        });

        carousel.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          dx = e.clientX - startX;
          track.style.transform =
            "translateX(calc(" + -index * 100 + "% + " + dx + "px))";
        });

        function endDrag() {
          if (!dragging) return;
          dragging = false;
          track.classList.remove("is-dragging");
          const threshold = Math.max(SWIPE_MIN, carousel.clientWidth * SWIPE_RATIO);
          if (dx <= -threshold) show(index + 1);
          else if (dx >= threshold) show(index - 1);
          else show(index); // snap back
          hold();
        }

        carousel.addEventListener("pointerup", endDrag);
        carousel.addEventListener("pointercancel", endDrag);

        // --- keyboard ---
        carousel.addEventListener("keydown", (e) => {
          if (e.key === "ArrowLeft") show(index - 1);
          else if (e.key === "ArrowRight") show(index + 1);
          else return;
          e.preventDefault();
          hold();
        });

        // Don't animate to a stale slide while the tab is in the background.
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) stop();
          else if (!resumeTimer) play();
        });

        show(0);
        play();
      })();
    </script>
  </body>
</html>
